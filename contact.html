<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact - Club de Drones</title>
</head>
<body>
	<h1>Contact/Inscription</h1>
	<h2>Entrez:</h2>
	<form>
	<p>
	Nom :<br>
	<input type="text" name="nom">
	</p>
	<p>
	Courriel:
	<br>
	<input type="email" name="courriel">
	</p>
	<h2>Devenir membre</h2>
	<p>
	Choisir:
	<br>
	<select name="Atelier">
		<option>Initiation Samedi 10h</option>
		<option>Perfectionnement Mercredi 18h</option>
		<option>Vol Libre Dimanche 14h</option>
	</select>
	<p>
	Choisir:
	<br>
		<select name="Lieu d'Atelier">
		<option>Interieur</option>
		<option>Exterieur</option>
	</select>
	</p>
	<p>
	Niveau :
	<br>
	<input type="radio" name="niveau" value="debutant"> Débutant
	<br>
	<input type="radio" name="niveau" value="intermediaire"> Intermédiaire
	<br>
	<input type="radio" name="niveau" value="avance"> Avancé
	</p>
	<p>
	<input type="submit" value="Envoyer">
	</p>
	</form>
	<p>
	<a href="index.html">Retour</a>
	</p>
</body>
</html>
